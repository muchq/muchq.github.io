<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100&family=Lexend:wght@100&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MuchQ</title>
    <style type="text/css">
      body {
        font-family: "Lexend Deca", sans-serif;
        font-optical-sizing: auto;
        font-weight: 100;
        font-style: normal;
        margin: 40px auto;
        max-width: 650px;
        line-height: 1.6;
        font-size: 18px;
        color: #444;
        padding: 80px 10px 10px 10px
      }
      h1,h2,h3 {
        line-height: 1.2
      }
      p {
        font-family:
          Latin Modern Math,
          math;
      }
      math {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 120px;
          height: 120px;
          margin:-60px 0 0 -60px;
          animation:spin 120s linear infinite;
      }
      math.third {
          left: 40%;
          animation: zoom-in-zoom-out 20s ease infinite;
      }
      math.fffo {
          top: 40%;
          left: 60%;
          animation:spin 50s linear infinite;
      }

      @keyframes spin {
          100% {
              transform:rotate(360deg);
          }
      }
      @keyframes zoom-in-zoom-out {
        0% {
          left: 40%;
          color: blue;
          transform:rotate(360deg);
          scale: 100%;
        }
        50% {
          left: 50%;
          color: yellow;
          transform:rotate(0deg);
          scale: 550%;
        }
        100% {
          left: 40%;
          color: red;
          transform:rotate(3240deg);
          scale: 100%;
        }
      }

      /* Navigation Styles */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(68, 68, 68, 0.1);
        z-index: 1000;
        transition: all 0.3s ease;
      }

      .nav-container {
        max-width: 650px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 60px;
      }

      .nav-logo {
        font-size: 20px;
        font-weight: 200;
        color: #444;
        text-decoration: none;
      }

      .nav-menu {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
        gap: 30px;
      }

      .nav-item {
        position: relative;
      }

      .nav-link {
        color: #444;
        text-decoration: none;
        font-size: 16px;
        padding: 8px 12px;
        border-radius: 4px;
        transition: all 0.3s ease;
        display: block;
      }

      .nav-link:hover {
        background: rgba(68, 68, 68, 0.05);
      }

      .dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        background: white;
        border: 1px solid rgba(68, 68, 68, 0.1);
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        min-width: 150px;
        padding: 8px 0;
      }

      .nav-item:hover .dropdown {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .dropdown-item {
        display: block;
        padding: 8px 16px;
        color: #444;
        text-decoration: none;
        font-size: 14px;
        transition: background 0.2s ease;
      }

      .dropdown-item:hover {
        background: rgba(68, 68, 68, 0.05);
      }

      .mobile-menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 18px;
        color: #444;
        cursor: pointer;
      }

      /* Mobile Styles */
      @media (max-width: 768px) {
        .nav-menu {
          position: absolute;
          top: 100%;
          left: 0;
          width: 100%;
          background: white;
          flex-direction: column;
          gap: 0;
          padding: 20px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
          opacity: 0;
          visibility: hidden;
          transform: translateY(-20px);
          transition: all 0.3s ease;
        }

        .nav-menu.active {
          opacity: 1;
          visibility: visible;
          transform: translateY(0);
        }

        .mobile-menu-toggle {
          display: block;
        }

        .nav-item {
          width: 100%;
        }

        .nav-link {
          padding: 12px 0;
          border-bottom: 1px solid rgba(68, 68, 68, 0.1);
        }

        .dropdown {
          position: static;
          opacity: 1;
          visibility: visible;
          transform: none;
          box-shadow: none;
          border: none;
          background: rgba(68, 68, 68, 0.02);
          margin-top: 8px;
          border-radius: 4px;
        }

        .nav-item:hover .dropdown {
          transform: none;
        }
      }

      /* Drift Animation */
      @keyframes drift-nav {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        50% {
          transform: translateX(120px) translateY(80px) rotate(8deg);
        }
        100% {
          transform: translateX(-80px) translateY(-60px) rotate(-5deg);
        }
      }

      @keyframes drift-logo {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        50% {
          transform: translateX(-100px) translateY(100px) rotate(-8deg);
        }
        100% {
          transform: translateX(60px) translateY(-40px) rotate(6deg);
        }
      }

      @keyframes drift-item-1 {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        33% {
          transform: translateX(80px) translateY(120px) rotate(5deg);
        }
        66% {
          transform: translateX(-60px) translateY(160px) rotate(-7deg);
        }
        100% {
          transform: translateX(40px) translateY(80px) rotate(3deg);
        }
      }

      @keyframes drift-item-2 {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        25% {
          transform: translateX(-70px) translateY(140px) rotate(-6deg);
        }
        75% {
          transform: translateX(90px) translateY(100px) rotate(8deg);
        }
        100% {
          transform: translateX(-30px) translateY(180px) rotate(-4deg);
        }
      }

      @keyframes drift-item-3 {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        40% {
          transform: translateX(110px) translateY(-40px) rotate(10deg);
        }
        80% {
          transform: translateX(-50px) translateY(60px) rotate(-5deg);
        }
        100% {
          transform: translateX(70px) translateY(20px) rotate(7deg);
        }
      }

      @keyframes drift-item-4 {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        30% {
          transform: translateX(-90px) translateY(-30px) rotate(-8deg);
        }
        70% {
          transform: translateX(50px) translateY(140px) rotate(6deg);
        }
        100% {
          transform: translateX(-40px) translateY(100px) rotate(-3deg);
        }
      }

      /* Apply drift animation after 3 seconds */
      .nav-container {
        animation: drift-nav 60s ease-in-out 3s infinite alternate;
      }

      .nav-logo {
        animation: drift-logo 45s ease-in-out 3.5s infinite alternate;
      }

      .nav-item:nth-child(1) {
        animation: drift-item-1 50s ease-in-out 4s infinite alternate;
      }

      .nav-item:nth-child(2) {
        animation: drift-item-2 55s ease-in-out 4.2s infinite alternate;
      }

      .nav-item:nth-child(3) {
        animation: drift-item-3 48s ease-in-out 4.5s infinite alternate;
      }

      .nav-item:nth-child(4) {
        animation: drift-item-4 52s ease-in-out 4.8s infinite alternate;
      }

      /* WebGL Canvas */
      #julia-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }

      /* Make sure content stays above canvas */
      body {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="julia-canvas"></canvas>
    <nav>
      <div class="nav-container">
        <a href="#" class="nav-logo">MuchQ</a>
        <ul class="nav-menu">
          <li class="nav-item">
            <a href="#" class="nav-link">Projects</a>
            <div class="dropdown">
              <a href="#" class="dropdown-item">Web Apps</a>
              <a href="#" class="dropdown-item">Open Source</a>
              <a href="#" class="dropdown-item">Graphics</a>
            </div>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Interests</a>
            <div class="dropdown">
              <a href="#" class="dropdown-item">Math</a>
              <a href="#" class="dropdown-item">Music</a>
              <a href="#" class="dropdown-item">Chess</a>
              <a href="#" class="dropdown-item">Space Stuff</a>
            </div>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Blog</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Resume</a>
          </li>
        </ul>
        <button class="mobile-menu-toggle">☰</button>
      </div>
    </nav>

    <script>
      document.querySelector('.mobile-menu-toggle').addEventListener('click', function() {
        document.querySelector('.nav-menu').classList.toggle('active');
      });

      // WebGL2 Julia Set Renderer
      const canvas = document.getElementById('julia-canvas');
      const gl = canvas.getContext('webgl2');

      if (!gl) {
        console.error('WebGL2 not supported');
      } else {
        // Vertex shader for fullscreen quad
        const vertexShaderSource = `#version 300 es
          in vec2 a_position;
          out vec2 v_uv;

          void main() {
            v_uv = a_position * 0.5 + 0.5;
            gl_Position = vec4(a_position, 0.0, 1.0);
          }
        `;

        // Fragment shader for Julia set computation
        const fragmentShaderSource = `#version 300 es
          precision highp float;

          in vec2 v_uv;
          out vec4 fragColor;

          uniform vec2 u_resolution;
          uniform vec2 u_juliaC;
          uniform float u_time;

          vec3 hsv2rgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
          }

          void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
            uv *= 2.0;

            vec2 z = uv;
            vec2 c = u_juliaC + vec2(sin(u_time * 0.1) * 0.1, cos(u_time * 0.15) * 0.1);

            float iterations = 0.0;
            const float maxIterations = 500.0;

            for(float i = 0.0; i < maxIterations; i++) {
              if(dot(z, z) > 4.0) break;

              // z = z^2 + c
              float temp = z.x * z.x - z.y * z.y + c.x;
              z.y = 2.0 * z.x * z.y + c.y;
              z.x = temp;

              iterations = i;
            }

            if(iterations >= maxIterations - 1.0) {
              // Retro grid pattern for convergent areas (inside Julia set)
              vec2 gridUV = uv * 8.0; // Scale for grid density
              vec2 gridLines = abs(fract(gridUV) - 0.5);
              float grid = min(gridLines.x, gridLines.y);

              // Create grid line thickness with smooth edges
              float lineWidth = 0.05;
              float gridMask = 1.0 - smoothstep(0.0, lineWidth, grid);

              // Iridescent color morphing based on position and time
              float colorPhase = length(uv) * 2.0 + u_time * 0.3;
              float hue1 = sin(colorPhase) * 0.5 + 0.5; // Base hue oscillation
              float hue2 = sin(colorPhase + 2.0) * 0.5 + 0.5; // Secondary hue

              // Map to retro color palette: pinks, blues, purples
              float retroHue = mix(0.8, 0.0, hue1) + mix(0.0, 0.3, hue2); // Purple to pink range
              retroHue = fract(retroHue); // Wrap around

              // Higher saturation and brightness for retro look
              float retroSat = 0.8 + sin(u_time * 0.2 + length(uv)) * 0.15;
              float retroBright = 0.6 + cos(u_time * 0.15 + uv.x * 2.0) * 0.2;

              vec3 retroColor = hsv2rgb(vec3(retroHue, retroSat, retroBright));

              // Blend grid with background
              vec3 bgColor = vec3(0.05, 0.02, 0.08); // Dark retro background
              vec3 finalColor = mix(bgColor, retroColor, gridMask * 0.8);

              fragColor = vec4(finalColor, 1.0);
            } else {
              float t = iterations / maxIterations;

              // Vibrant light color scheme with better contrast
              float hue = t * 1.2 + sin(u_time * 0.05) * 0.15; // More dynamic hue cycling
              float saturation = 0.6 + t * 0.3; // Higher saturation for vibrancy
              float brightness = 0.75 + t * 0.2; // Slightly lower brightness for contrast

              vec3 color = hsv2rgb(vec3(hue, saturation, brightness));
              fragColor = vec4(color, 0.8); // Slight transparency
            }
          }
        `;

        function createShader(gl, type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);

          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
            return null;
          }

          return shader;
        }

        function createProgram(gl, vertexShader, fragmentShader) {
          const program = gl.createProgram();
          gl.attachShader(program, vertexShader);
          gl.attachShader(program, fragmentShader);
          gl.linkProgram(program);

          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('Program linking error:', gl.getProgramInfoLog(program));
            gl.deleteProgram(program);
            return null;
          }

          return program;
        }

        // Create shaders and program
        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
        const program = createProgram(gl, vertexShader, fragmentShader);

        // Set up fullscreen quad
        const positions = new Float32Array([
          -1, -1,
           1, -1,
          -1,  1,
           1,  1,
        ]);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        const positionLocation = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        // Get uniform locations
        const resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
        const juliaCLocation = gl.getUniformLocation(program, 'u_juliaC');
        const timeLocation = gl.getUniformLocation(program, 'u_time');

        // Mouse tracking with scaled interesting parameter ranges
        // Default to visually interesting coordinates for mobile users
        let mouseX = -0.4;
        let mouseY = 0.6;

        document.addEventListener('mousemove', (e) => {
          // Map full screen where:
          // - Left edge (0% of screen) maps to (0, 0) - center of Mandelbrot set
          // - Right edge (100% of screen) maps to boundary of interesting region
          const normalizedX = e.clientX / window.innerWidth; // [0, 1]
          const normalizedY = -((e.clientY / window.innerHeight) * 2.0 - 1.0); // [-1, 1]

          // Scale X from [0, 1] to [0, 0.75] so leftmost position is center (0,0)
          const scaledX = normalizedX * 0.75;
          const scaledY = normalizedY * 0.75;

          // Convert to polar coordinates for biasing towards interesting regions
          const angle = Math.atan2(scaledY, scaledX);
          const radius = Math.sqrt(scaledX * scaledX + scaledY * scaledY);

          // Bias towards the boundary region (around radius 0.3-0.7)
          const biasedRadius = Math.min(radius * 0.8 + 0.2, 0.7);

          mouseX = Math.cos(angle) * biasedRadius;
          mouseY = Math.sin(angle) * biasedRadius;
        });

        // Resize canvas
        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          gl.viewport(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Animation loop
        function render(time) {
          gl.useProgram(program);
          gl.bindVertexArray(vao);

          gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
          gl.uniform2f(juliaCLocation, mouseX, mouseY);
          gl.uniform1f(timeLocation, time * 0.001);

          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

          requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
      }
    </script>

    <h1>Hello</h1>
    <p>
    <math class="third">
      <mfrac>
      <mn>1</mn>
      <mn>π</mn>
      </mfrac>
    </math>
    </p>
    <math class="fffo">
      <mi>∀A</mi>
      <mo>∊</mo>
      <mi>𝔰𝔩(n,𝔽)</mi>
      <mspace></mspace>
      <mo>,</mo>
      <mspace></mspace>
      <mi>TrA</mi>
      <mo>=</mo>
      <mi>0</mi>
    </math>
  </body>
</html>
