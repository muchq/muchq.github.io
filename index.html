<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100&family=Lexend:wght@100&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MuchQ</title>
    <style type="text/css">
      body {
        font-family: "Lexend Deca", sans-serif;
        font-optical-sizing: auto;
        font-weight: 100;
        font-style: normal;
        margin: 40px auto;
        max-width: 650px;
        line-height: 1.6;
        font-size: 18px;
        color: #444;
        padding: 80px 10px 10px 10px
      }
      h1,h2,h3 {
        line-height: 1.2
      }
      p {
        font-family:
          Latin Modern Math,
          math;
      }
      math {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 120px;
          height: 120px;
          margin:-60px 0 0 -60px;
          animation:spin 120s linear infinite;
      }
      math.third {
          left: 40%;
          animation: zoom-in-zoom-out 20s ease infinite;
      }
      math.fffo {
          top: 40%;
          left: 60%;
          animation:spin 50s linear infinite;
      }

      @keyframes spin {
          100% {
              transform:rotate(360deg);
          }
      }
      @keyframes zoom-in-zoom-out {
        0% {
          left: 40%;
          color: blue;
          transform:rotate(360deg);
          scale: 100%;
        }
        50% {
          left: 50%;
          color: yellow;
          transform:rotate(0deg);
          scale: 550%;
        }
        100% {
          left: 40%;
          color: red;
          transform:rotate(3240deg);
          scale: 100%;
        }
      }

      /* Navigation Styles */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(68, 68, 68, 0.1);
        z-index: 1000;
        transition: all 0.3s ease;
      }

      .nav-container {
        max-width: 650px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 60px;
      }

      .nav-logo {
        font-size: 20px;
        font-weight: 200;
        color: #444;
        text-decoration: none;
      }

      .nav-menu {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
        gap: 30px;
      }

      .nav-item {
        position: relative;
      }

      .nav-link {
        color: #444;
        text-decoration: none;
        font-size: 16px;
        padding: 8px 12px;
        border-radius: 4px;
        transition: all 0.3s ease;
        display: block;
      }

      .nav-link:hover {
        background: rgba(68, 68, 68, 0.05);
      }

      .dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        background: white;
        border: 1px solid rgba(68, 68, 68, 0.1);
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        min-width: 150px;
        padding: 8px 0;
      }

      .nav-item:hover .dropdown {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .dropdown-item {
        display: block;
        padding: 8px 16px;
        color: #444;
        text-decoration: none;
        font-size: 14px;
        transition: background 0.2s ease;
      }

      .dropdown-item:hover {
        background: rgba(68, 68, 68, 0.05);
      }

      .mobile-menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 18px;
        color: #444;
        cursor: pointer;
      }

      /* Mobile Styles */
      @media (max-width: 768px) {
        .nav-menu {
          position: absolute;
          top: 100%;
          left: 0;
          width: 100%;
          background: white;
          flex-direction: column;
          gap: 0;
          padding: 20px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
          opacity: 0;
          visibility: hidden;
          transform: translateY(-20px);
          transition: all 0.3s ease;
        }

        .nav-menu.active {
          opacity: 1;
          visibility: visible;
          transform: translateY(0);
        }

        .mobile-menu-toggle {
          display: block;
        }

        .nav-item {
          width: 100%;
        }

        .nav-link {
          padding: 12px 0;
          border-bottom: 1px solid rgba(68, 68, 68, 0.1);
        }

        .dropdown {
          position: static;
          opacity: 1;
          visibility: visible;
          transform: none;
          box-shadow: none;
          border: none;
          background: rgba(68, 68, 68, 0.02);
          margin-top: 8px;
          border-radius: 4px;
        }

        .nav-item:hover .dropdown {
          transform: none;
        }
      }

      /* Drift Animation */
      @keyframes drift-nav {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        50% {
          transform: translateX(120px) translateY(80px) rotate(8deg);
        }
        100% {
          transform: translateX(-80px) translateY(-60px) rotate(-5deg);
        }
      }

      @keyframes drift-logo {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        50% {
          transform: translateX(-100px) translateY(100px) rotate(-8deg);
        }
        100% {
          transform: translateX(60px) translateY(-40px) rotate(6deg);
        }
      }

      @keyframes drift-item-1 {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        33% {
          transform: translateX(80px) translateY(120px) rotate(5deg);
        }
        66% {
          transform: translateX(-60px) translateY(160px) rotate(-7deg);
        }
        100% {
          transform: translateX(40px) translateY(80px) rotate(3deg);
        }
      }

      @keyframes drift-item-2 {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        25% {
          transform: translateX(-70px) translateY(140px) rotate(-6deg);
        }
        75% {
          transform: translateX(90px) translateY(100px) rotate(8deg);
        }
        100% {
          transform: translateX(-30px) translateY(180px) rotate(-4deg);
        }
      }

      @keyframes drift-item-3 {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        40% {
          transform: translateX(110px) translateY(-40px) rotate(10deg);
        }
        80% {
          transform: translateX(-50px) translateY(60px) rotate(-5deg);
        }
        100% {
          transform: translateX(70px) translateY(20px) rotate(7deg);
        }
      }

      @keyframes drift-item-4 {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        30% {
          transform: translateX(-90px) translateY(-30px) rotate(-8deg);
        }
        70% {
          transform: translateX(50px) translateY(140px) rotate(6deg);
        }
        100% {
          transform: translateX(-40px) translateY(100px) rotate(-3deg);
        }
      }

      /* Apply drift animation after 3 seconds */
      .nav-container {
        animation: drift-nav 60s ease-in-out 3s infinite alternate;
      }

      .nav-logo {
        animation: drift-logo 45s ease-in-out 3.5s infinite alternate;
      }

      .nav-item:nth-child(1) {
        animation: drift-item-1 50s ease-in-out 4s infinite alternate;
      }

      .nav-item:nth-child(2) {
        animation: drift-item-2 55s ease-in-out 4.2s infinite alternate;
      }

      .nav-item:nth-child(3) {
        animation: drift-item-3 48s ease-in-out 4.5s infinite alternate;
      }

      .nav-item:nth-child(4) {
        animation: drift-item-4 52s ease-in-out 4.8s infinite alternate;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <a href="#" class="nav-logo">MuchQ</a>
        <ul class="nav-menu">
          <li class="nav-item">
            <a href="#" class="nav-link">Projects</a>
            <div class="dropdown">
              <a href="#" class="dropdown-item">Web Apps</a>
              <a href="#" class="dropdown-item">Open Source</a>
              <a href="#" class="dropdown-item">Research</a>
            </div>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Interests</a>
            <div class="dropdown">
              <a href="#" class="dropdown-item">Mathematics</a>
              <a href="#" class="dropdown-item">Physics</a>
              <a href="#" class="dropdown-item">Technology</a>
            </div>
          </li>
          <li class="nav-item">
            <a href="blog.html" class="nav-link">Blog</a>
          </li>
          <li class="nav-item">
            <a href="resume.html" class="nav-link">Resume</a>
          </li>
        </ul>
        <button class="mobile-menu-toggle">☰</button>
      </div>
    </nav>

    <script>
      document.querySelector('.mobile-menu-toggle').addEventListener('click', function() {
        document.querySelector('.nav-menu').classList.toggle('active');
      });
    </script>

    <h1>Hello</h1>
    <p>
    <math class="third">
      <mfrac>
      <mn>1</mn>
      <mn>π</mn>
      </mfrac>
    </math>
    </p>
    <math class="fffo">
      <mi>∀A</mi>
      <mo>∊</mo>
      <mi>𝔰𝔩(n,𝔽)</mi>
      <mspace></mspace>
      <mo>,</mo>
      <mspace></mspace>
      <mi>TrA</mi>
      <mo>=</mo>
      <mi>0</mi>
    </math>
  </body>
</html>
